[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-factory"
version = "0.1.0"
description = "Free-first AI video factory: script → scenes → images → videos → voice → mixed audio → subtitles → final render, with a PySide6 GUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Video Factory" }]
keywords = ["video", "ai", "ffmpeg", "tts", "arabic", "gui"]
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "Pillow>=10.3",
    "PySide6>=6.7",
    "edge-tts>=6.1",
    "imageio-ffmpeg>=0.5",
    "av>=11",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
ai-video-factory = "ai_video_factory.cli:main"

[project.gui-scripts]
ai-video-factory-gui = "ai_video_factory.cli:main"

[tool.setuptools.packages.find]
include = ["ai_video_factory*"]

[tool.setuptools.package-data]
"ai_video_factory" = ["assets/**/*", "assets/*", "py.typed"]
